[package]
name = "cce-conformance"
version = "0.1.0"
edition = "2021"
license = "SEE-REPO-ROOT"
publish = false

[dependencies]
cce-core = { path = "../crates/cce-core" }
cce-crystal = { path = "../crates/cce-crystal" }
cce-phc = { path = "../crates/cce-phc" }
cce-spiral = { path = "../crates/cce-spiral" }
cce-loom = { path = "../crates/cce-loom" }
cce-observe = { path = "../crates/cce-observe" }
cce-materialize = { path = "../crates/cce-materialize" }
cce-library = { path = "../crates/cce-library" }
cce-store = { path = "../crates/cce-store" }
nexus-core = { path = "../nexus/nexus-core" }
nexus-adapter = { path = "../nexus/nexus-adapter" }
nexus-policy = { path = "../nexus/nexus-policy" }
nexus-fetch = { path = "../nexus/nexus-fetch" }
nexus-validate = { path = "../nexus/nexus-validate" }
nexus-evidence = { path = "../nexus/nexus-evidence" }
nexus-ledger = { path = "../nexus/nexus-ledger" }
nexus-export = { path = "../nexus/nexus-export" }
nexus-cell = { path = "../nexus/nexus-cell" }
nexus-ingress = { path = "../nexus/nexus-ingress" }
nexus-decode = { path = "../nexus/nexus-decode" }
nexus-store = { path = "../nexus/nexus-store" }
nexus-adapter-local-corpus = { path = "../nexus/adapters/local_corpus" }
nexus-adapter-wikimedia = { path = "../nexus/adapters/wikimedia" }
nexus-adapter-git = { path = "../nexus/adapters/git_repository" }
cce-inference = { path = "../crates/cce-inference" }
cce-toolgateway = { path = "../crates/cce-toolgateway" }
cce-phaseblock = { path = "../crates/cce-phaseblock" }
cce-hbm = { path = "../crates/cce-hbm" }
loom-conformance = { path = "../loom/loom-conformance" }
loom-verify = { path = "../loom/loom-verify" }
loom-mount = { path = "../loom/loom-mount" }
loom-cli = { path = "../loom/loom-cli" }
loom-canon = { path = "../loom/loom-canon" }
loom-format = { path = "../loom/loom-format" }
loom-codec = { path = "../loom/loom-codec" }
loom-cites = { path = "../loom/loom-cites" }
cockpit-core = { path = "../cockpit/cockpit-core" }
cce-runner = { path = "../crates/cce-runner" }
cce-bridge = { path = "../crates/cce-bridge" }
loom-replay = { path = "../loom/loom-replay" }
cce-swe = { path = "../crates/cce-swe" }
cce-dogfood = { path = "../crates/cce-dogfood" }

# Betriebsverifikation P1 (echter Egress, #[ignore]): reicht das
# `http`-Feature NUR durch, aktiviert selbst nichts im Default-Bau.
# `process` (P2) reicht analog die reale git/build/test-Prozessfaehigkeit
# durch (cce-toolgateway) -- ebenfalls nur #[ignore]-Betriebsschritte,
# kein Default-Verhalten.
[features]
http = ["cce-inference/http"]
process = ["cce-toolgateway/process", "cce-swe/process", "cce-dogfood/process"]

# Inference-Zeugen liegen per Overlay-05 Teil G unter conformance/inference/
[[test]]
name = "inference_catalog"
path = "inference/inference_catalog.rs"

# SWE-Zeugen (Dokument 18, P2) liegen unter conformance/swe/
[[test]]
name = "swe_catalog"
path = "swe/swe_catalog.rs"

# Dogfooding-Negativzeugen (Dokument 19, P3) liegen unter
# conformance/dogfood/ -- N-DOG-1..4 laufen hermetisch in der
# Default-CI; der eine reale Beweis (R-DOG-1) lebt separat als
# #[ignore]-Test in crates/cce-dogfood/tests/.
[[test]]
name = "dogfood_catalog"
path = "dogfood/dogfood_catalog.rs"
