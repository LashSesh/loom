[package]
name = "loom-cli"
version = "0.1.0"
edition = "2021"
license = "SEE-REPO-ROOT"
publish = false

[dependencies]
loom-canon = { path = "../loom-canon" }
loom-format = { path = "../loom-format" }
loom-codec = { path = "../loom-codec" }
loom-verify = { path = "../loom-verify" }
loom-mount = { path = "../loom-mount" }
# P6(c): Krypto NUR im CLI-Blatt (kein Kern-Crate erhaelt neue Deps).
# Ed25519 signiert core_root ins SIGNATURE-Segment (0x0050, non_core).
ed25519-dalek = "2"
# OS-Schluesselbund NUR unter opt-in-Feature `keyring` (headless-CI
# hat keinen Backend; Standard ist der seed-/dateibasierte Pfad).
keyring = { version = "3", optional = true }
# X1(c) (Oekosystem-Karte §2/E1): zstd-Transportprofil + blake3-
# Zweitprofil — dieselbe Disziplin wie Ed25519: externe Kisten NUR
# hier im CLI-Blatt, kein Kern-/Codec-Crate aendert sich.
zstd = "0.13"
blake3 = "1"

[features]
keyring-os = ["dep:keyring"]

[lib]
name = "loom_cli"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"
